services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: movie_app
      POSTGRES_PASSWORD: movie_app_local
      POSTGRES_DB: movie_app
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movie_app -d movie_app"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
